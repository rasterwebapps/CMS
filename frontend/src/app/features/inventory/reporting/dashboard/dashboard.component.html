<div class="mlp-page">

  <!-- ── Page Header ─────────────────────────────────────────── -->
  <div class="mlp-hdr anim-rise">
    <div class="mlp-hdr-left">
      <div class="page-title-row">
        <h1 class="idb-pg-title">Inventory <em>Dashboard</em></h1>
      </div>
      <p class="idb-pg-sub">
        An at-a-glance overview across the whole module.
        @if (dashboard(); as d) { <span class="idb-generated">Updated {{ d.generatedAt | date: 'short' }}</span> }
      </p>
    </div>
    <div class="mlp-hdr-actions">
      <button class="btn-secondary" [disabled]="loading()" (click)="load()" aria-label="Refresh dashboard">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
        Refresh
      </button>
    </div>
  </div>

  @if (loading() && !dashboard()) {
    <div class="idb-loading"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <div class="stat-grid idb-grid">
      @for (tile of tiles(); track tile.label) {
        <div class="stat-card idb-tile" [class.stat-card--accent]="tile.accent" (click)="openTile(tile)" role="button" tabindex="0">
          <div class="stat-label">{{ tile.label }}</div>
          <div class="stat-value">{{ tile.value | number: '1.0-2' }}</div>
        </div>
      }
    </div>
  }

</div>
