<div class="mlp-page">

  <div class="mlp-hdr anim-rise">
    <div class="mlp-hdr-left">
      <h1 class="page-title">Timetable</h1>
      <p class="page-subtitle">Browse the published theory and lab timetable for a term</p>
    </div>
  </div>

  <div class="mlp-toolbar anim-rise anim-rise--d1">
    <select class="mlp-filter-select" [(ngModel)]="selectedAcademicYearId" (ngModelChange)="onAcademicYearChange()" aria-label="Academic year">
      @for (ay of academicYears(); track ay.id) {
        <option [ngValue]="ay.id">{{ ay.name }}</option>
      }
    </select>
    <select class="mlp-filter-select" [(ngModel)]="selectedTermInstanceId" (ngModelChange)="onTermChange()"
      [disabled]="termsLoading() || termInstances().length === 0" aria-label="Term">
      @if (termInstances().length === 0) {
        <option [ngValue]="null">No terms yet</option>
      }
      @for (term of termInstances(); track term.id) {
        <option [ngValue]="term.id">{{ term.termType }} · {{ term.status }}</option>
      }
    </select>
  </div>

  <div class="content-card">
    @if (loading()) {
      <div class="loading-container">
        <mat-spinner diameter="36" aria-label="Loading timetable"></mat-spinner>
      </div>
    } @else {
      <cms-week-grid mode="browse" [sessions]="sessions()" />
    }
  </div>

</div>
