<div class="mlp-page">

  <div class="mlp-hdr anim-rise">
    <div class="mlp-hdr-left">
      <div style="display: flex; align-items: center; gap: 12px;">
        <h1 class="mlp-title">Timetable <em>Draft Review</em></h1>
        <cms-tour-button tourKey="timetable-draft-review" [iconOnly]="true" iconVariant="info-circle" />
      </div>
      <p class="page-subtitle">Review the draft built via Skeleton Builder + Staffing, swap sessions if needed, and approve it once it looks right</p>
    </div>
  </div>

  <div id="tour-tdr-toolbar" class="mlp-toolbar anim-rise anim-rise--d1">
    <select class="mlp-filter-select" [(ngModel)]="selectedAcademicYearId" (ngModelChange)="onAcademicYearChange()" aria-label="Academic year">
      @for (ay of academicYears(); track ay.id) {
        <option [ngValue]="ay.id">{{ ay.name }}</option>
      }
    </select>
    <select class="mlp-filter-select" [(ngModel)]="selectedTermInstanceId" (ngModelChange)="onTermChange()"
      [disabled]="termsLoading() || termInstances().length === 0" aria-label="Term">
      @if (termInstances().length === 0) {
        <option [ngValue]="null">No terms yet</option>
      }
      @for (term of termInstances(); track term.id) {
        <option [ngValue]="term.id">{{ term.termType }} · {{ term.status }}</option>
      }
    </select>
  </div>

  @if (swapMode()) {
    <div class="content-card timetable-swap-banner">
      <span>Pick a highlighted slot for <strong>{{ swapSource()?.subjectName }}</strong>, or</span>
      <button type="button" class="btn-secondary" [disabled]="swapping()" (click)="onCancelSwap()">Cancel</button>
    </div>
  }

  <div id="tour-tdr-grid" class="content-card">
    @if (loading()) {
      <div class="loading-container">
        <mat-spinner diameter="36" aria-label="Loading timetable"></mat-spinner>
      </div>
    } @else {
      <cms-week-grid
        mode="review"
        [sessions]="sessions()"
        [saving]="saving() || swapping()"
        [allowManage]="canManage()"
        [allowRevert]="canRevert()"
        [swapMode]="swapMode()"
        [swapSourceSessionId]="swapSource()?.id ?? null"
        [candidateCells]="candidateCells()"
        (approveClick)="onApprove()"
        (discardClick)="onDiscard()"
        (revertClick)="onRevert()"
        (sessionClick)="onSessionClick($event)"
        (cellClick)="onCandidateCellClick($event)"
      />
    }
  </div>

</div>
