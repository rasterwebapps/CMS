<div class="mlp-page">

  <!-- ── Page Header ─────────────────────────────────────────── -->
  <div class="mlp-hdr anim-rise">
    <div class="mlp-hdr-left">
      <div class="page-title-row">
        <h1 class="gr-pg-title">Goods <em>Receipts</em></h1>
      </div>
      <p class="gr-pg-sub">Deliveries recorded against a purchase order — confirming posts stock.</p>
    </div>
    <div class="mlp-hdr-actions">
      <button class="btn-primary" (click)="goToNew()" aria-label="Start a new goods receipt">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Receipt
      </button>
    </div>
  </div>

  <!-- ── Toolbar ───────────────────────────────────────────────── -->
  <div class="mlp-toolbar anim-rise anim-rise--d1">
    <select class="field-select gr-filter" [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()" aria-label="Filter by status">
      <option [ngValue]="null">All Statuses</option>
      <option value="DRAFT">Draft</option>
      <option value="CONFIRMED">Confirmed</option>
    </select>
  </div>

  <div class="content-card mlp-table-card">
    <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" class="gr-table">
      <ng-container matColumnDef="receiptDate">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let row">{{ row.receiptDate | date: 'mediumDate' }}</td>
      </ng-container>
      <ng-container matColumnDef="purchaseOrderId">
        <th mat-header-cell *matHeaderCellDef>Order</th>
        <td mat-cell *matCellDef="let row">#{{ row.purchaseOrderId }}</td>
      </ng-container>
      <ng-container matColumnDef="supplierName">
        <th mat-header-cell *matHeaderCellDef>Supplier</th>
        <td mat-cell *matCellDef="let row">{{ row.supplierName }}</td>
      </ng-container>
      <ng-container matColumnDef="locationVirtualName">
        <th mat-header-cell *matHeaderCellDef>Location</th>
        <td mat-cell *matCellDef="let row">{{ row.locationVirtualName }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="cell-align-center">Status</th>
        <td mat-cell *matCellDef="let row" class="cell-align-center">
          <cms-status-badge [status]="row.status" />
        </td>
      </ng-container>
      <ng-container matColumnDef="lineCount">
        <th mat-header-cell *matHeaderCellDef class="cell-align-right">Lines</th>
        <td mat-cell *matCellDef="let row" class="cell-align-right">{{ row.lineCount }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"></th>
        <td mat-cell *matCellDef="let row">
          <div class="row-actions">
            <cms-row-action-btn variant="success" [iconOnly]="true" tooltip="Open" ariaLabel="Open goods receipt" (clicked)="openReceipt(row)">
              <cms-icon-view [size]="14" />
            </cms-row-action-btn>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openReceipt(row)" class="gr-row"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="padding:0; border:none;">
          <cms-empty-state
            icon="move_to_inbox"
            title="No goods receipts yet"
            subtitle="Record a delivery against a sent purchase order to see it here."
            actionLabel="New Receipt"
            (actionClick)="goToNew()"
          ></cms-empty-state>
        </td>
      </tr>
    </table>
    </div>
    <mat-paginator [length]="totalElements" [pageSizeOptions]="[10, 25, 50]" [pageSize]="25" showFirstLastButtons></mat-paginator>
  </div>

</div>
