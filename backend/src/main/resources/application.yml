spring:
  profiles:
    default: local

  application:
    name: cms-backend

  cache:
    type: none

  threads:
    virtual:
      enabled: true

  # Explicit pool sizing so one slow/misbehaving module can't starve every other
  # module of DB connections. Virtual threads let Tomcat admit far more concurrent
  # requests than this pool has connections, so a bounded pool + fail-fast timeout
  # is what protects the rest of the app when one query runs long.
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      leak-detection-threshold: 30000

  # Serialize Instant/Date as ISO-8601 UTC strings (e.g. "2026-04-28T08:30:00Z")
  # so the frontend receives UTC timestamps and converts them to local time.
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Force Hibernate/JDBC to store and read all timestamp columns in UTC.
  # OSIV disabled: keeping the EntityManager open for the full HTTP request
  # causes connections obtained during @PreAuthorize permission checks to be
  # held until the request ends — triggering false leak warnings on long imports.
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Allow uploading reasonably-large PDF/image documents (e.g. faculty photos,
  # signed appointment letters). The faculty UI advertises 10 MB per file —
  # both the per-file and per-request limits must accommodate that.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  servlet:
    context-path: /api/v1

# CORS allowed origins — override per profile or environment variable
cors:
  allowed-origins: https://localhost:4200,https://localhost:4300,https://172.17.3.133:4200,https://172.17.3.133:4300

# Seed data is opt-in only. The default local profile must use the actual
# PostgreSQL data that is already present in the configured database.
cms:
  seed:
    enabled: false
  minio:
    endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:cms_minio}
    secret-key: ${MINIO_SECRET_KEY:changeme_local}
    bucket:     ${MINIO_BUCKET:cms-documents}

# Keycloak Admin REST API — used to create/delete users programmatically.
# Override via environment variables; defaults below suit local dev.
keycloak:
  admin:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8280}
    realm: ${KEYCLOAK_REALM:cms}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

