# Production docker-compose — dedicated deployment server: 172.16.7.209
# Public URL: https://cms.nursing.sksh.ac.in
#
# Run only on 172.16.7.209 from /docker_data/skscms209:
#   docker compose -p skscms209 -f docker-compose.yml --env-file .env up -d
#
# Required variables in /docker_data/skscms209/.env (chmod 600):
#   DB_USERNAME              — Postgres superuser / Keycloak DB user (cms_user)
#   DB_PASSWORD              — Password for DB_USERNAME
#   BACKEND_DB_USERNAME      — Low-privilege app user for Spring Boot (cms_app)
#   BACKEND_DB_PASSWORD      — Password for BACKEND_DB_USERNAME
#   KEYCLOAK_ADMIN_PASSWORD
#   DEPLOY_HOST=cms.nursing.sksh.ac.in
#   PUBLIC_IP=137.97.6.147
#   LOCAL_HOST=172.16.7.209
#
# This file is intentionally separate from legacy 243 deployment files.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT: '5433'
    volumes:
      - postgres_data_209:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d cms -p 5433']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    network_mode: host
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5433/cms
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Dynamic hostname mode lets Keycloak issue URLs for whichever approved
      # browser origin was used: domain, public IP, or LAN IP.
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8180'
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: cms-backend:latest
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: 209
      DB_URL: jdbc:postgresql://localhost:5433/cms
      # Use the dedicated low-privilege app user (Phase 2.10 — security hardening).
      # cms_app has SELECT/INSERT/UPDATE/DELETE only — not the Postgres superuser.
      DB_USERNAME: ${BACKEND_DB_USERNAME}
      DB_PASSWORD: ${BACKEND_DB_PASSWORD}
      # Flyway needs the DB owner role for DDL migrations (ALTER TABLE, CREATE TABLE, etc.).
      # The application datasource above remains low-privilege after startup.
      FLYWAY_DB_URL: jdbc:postgresql://localhost:5433/cms
      FLYWAY_DB_USERNAME: ${DB_USERNAME}
      FLYWAY_DB_PASSWORD: ${DB_PASSWORD}
      # Primary issuer remains for compatibility; SecurityConfig accepts all
      # issuers listed in KEYCLOAK_ALLOWED_ISSUERS below.
      KEYCLOAK_ISSUER_URI: https://${DEPLOY_HOST}/realms/cms
      KEYCLOAK_JWK_SET_URI: http://localhost:8180/realms/cms/protocol/openid-connect/certs
      KEYCLOAK_ALLOWED_ISSUERS: https://${DEPLOY_HOST}/realms/cms,https://${PUBLIC_IP}/realms/cms,https://${LOCAL_HOST}/realms/cms
      CORS_ALLOWED_ORIGINS: https://${DEPLOY_HOST},https://${PUBLIC_IP},https://${LOCAL_HOST}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:8080/api/v1/health >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: cms-frontend:latest
    restart: unless-stopped
    network_mode: host
    environment:
      # Leave KEYCLOAK_URL unset so Angular uses the current browser origin.
      KEYCLOAK_REALM: cms
      KEYCLOAK_CLIENT_ID: cms-frontend
      KEYCLOAK_UPSTREAM: 127.0.0.1:8180
      BACKEND_UPSTREAM: 127.0.0.1:8080
      KEYCLOAK_CANONICAL_HOST: cms.nursing.sksh.ac.in
      KEYCLOAK_CANONICAL_PORT: "443"
    volumes:
      - ./ssl/self.crt:/etc/nginx/ssl/self.crt:ro
      - ./ssl/self.key:/etc/nginx/ssl/self.key:ro
    depends_on:
      - backend

volumes:
  postgres_data_209:

