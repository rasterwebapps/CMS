<div class="content-card widget-card activity-card">
  <div class="widget-header">
    <div class="widget-icon-wrap"><mat-icon>history</mat-icon></div>
    <h3 class="widget-title">Recent Activity</h3>
  </div>
  <div class="widget-card__body">
    @if (items.length === 0) {
      <p class="empty-hint">No recent activity.</p>
    } @else {
      <div class="ra-timeline">
        @for (item of items; track item.id) {
          <div class="ra-item">
            <div class="ra-dot" [style.background]="colorFor(item.action)">
              <mat-icon>{{ iconFor(item.action) }}</mat-icon>
            </div>
            <div class="ra-body">
              <p class="ra-text">{{ item.action }}</p>
              <span class="ra-meta">{{ item.actor }} · {{ item.timestamp | appDate:'dateTime' }}</span>
            </div>
          </div>
        }
      </div>
    }
  </div>
</div>
