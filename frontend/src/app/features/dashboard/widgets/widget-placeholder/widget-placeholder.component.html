<div class="wp-shell">
  <!-- Header row with icon + label -->
  <div class="wp-header">
    <div class="wp-icon-bubble">
      <mat-icon>{{ widgetIcon || 'widgets' }}</mat-icon>
    </div>
    <span class="wp-label">{{ widgetLabel || widgetKey || 'Widget' }}</span>
    <span class="wp-chip">Coming in Phase 4</span>
  </div>

  <!-- Skeleton body -->
  <div class="wp-body">
    <div class="sk-line sk-line--full"></div>
    <div class="sk-line sk-line--half"></div>
    <div class="sk-line sk-line--three-quarter"></div>
    <div class="sk-gap"></div>
    <div class="sk-line sk-line--half"></div>
    <div class="sk-line sk-line--full"></div>
  </div>
</div>
