spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/cmsdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:cms}
    password: ${DB_PASSWORD:cms}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/cms
