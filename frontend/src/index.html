<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OneCMS — College Management System</title>
    <base href="/" />
    <!-- Runtime config — loaded before Angular so Keycloak URL is injectable per server -->
    <script src="assets/env.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- All fonts and icons self-hosted — zero external network dependency -->
    <link rel="preload" href="assets/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Razorpay's hosted Checkout.js — the one deliberate exception to the self-hosting policy
         above. Required (and only legitimately loadable) from Razorpay's own domain so card/UPI
         details are collected inside their iframe, never our own code — this is what keeps the
         app out of full PCI-DSS scope (SAQ-A vs SAQ-D), a decision made in the Parent Portal
         payment specialist review. Self-hosting a copy is against Razorpay's own terms and breaks
         their fraud detection, so this can't be brought in-house the way fonts/icons were. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
