<div class="mlp-page">

  <!-- ── Page Header ─────────────────────────────────────────── -->
  <div class="mlp-hdr anim-rise">
    <div class="mlp-hdr-left">
      <div class="page-title-row">
        <h1 class="st-pg-title">Stock <em>Transfers</em></h1>
      </div>
      <p class="st-pg-sub">Move stock between two locations.</p>
    </div>
    <div class="mlp-hdr-actions">
      <button class="btn-primary" (click)="goToNew()" aria-label="Start a new stock transfer">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Transfer
      </button>
    </div>
  </div>

  <!-- ── Toolbar ───────────────────────────────────────────────── -->
  <div class="mlp-toolbar anim-rise anim-rise--d1">
    <select class="field-select st-filter" [(ngModel)]="locationFilter" (ngModelChange)="onFilterChange()" aria-label="Filter by location">
      <option [ngValue]="null">All Locations</option>
      @for (l of locations(); track l.id) {
        <option [ngValue]="l.id">{{ l.virtualName }}</option>
      }
    </select>
    <select class="field-select st-filter" [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()" aria-label="Filter by status">
      <option [ngValue]="null">All Statuses</option>
      <option value="DRAFT">Draft</option>
      <option value="COMPLETED">Completed</option>
      <option value="CANCELLED">Cancelled</option>
    </select>
  </div>

  <div class="content-card mlp-table-card">
    <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" class="st-table">
      <ng-container matColumnDef="transferDate">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let row">{{ row.transferDate | date: 'mediumDate' }}</td>
      </ng-container>
      <ng-container matColumnDef="sourceLocationVirtualName">
        <th mat-header-cell *matHeaderCellDef>From</th>
        <td mat-cell *matCellDef="let row">{{ row.sourceLocationVirtualName }}</td>
      </ng-container>
      <ng-container matColumnDef="destinationLocationVirtualName">
        <th mat-header-cell *matHeaderCellDef>To</th>
        <td mat-cell *matCellDef="let row">{{ row.destinationLocationVirtualName }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="cell-align-center">Status</th>
        <td mat-cell *matCellDef="let row" class="cell-align-center">
          <cms-status-badge [status]="row.status" />
        </td>
      </ng-container>
      <ng-container matColumnDef="lineCount">
        <th mat-header-cell *matHeaderCellDef class="cell-align-right">Products</th>
        <td mat-cell *matCellDef="let row" class="cell-align-right">{{ row.lineCount }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"></th>
        <td mat-cell *matCellDef="let row">
          <div class="row-actions">
            <cms-row-action-btn variant="success" [iconOnly]="true" tooltip="Open" ariaLabel="Open stock transfer" (clicked)="openTransfer(row)">
              <cms-icon-view [size]="14" />
            </cms-row-action-btn>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openTransfer(row)" class="st-row"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="padding:0; border:none;">
          <cms-empty-state
            icon="sync_alt"
            title="No stock transfers yet"
            subtitle="Move stock from one location to another to see it here."
            actionLabel="New Transfer"
            (actionClick)="goToNew()"
          ></cms-empty-state>
        </td>
      </tr>
    </table>
    </div>
    <mat-paginator [length]="totalElements" [pageSizeOptions]="[10, 25, 50]" [pageSize]="25" showFirstLastButtons></mat-paginator>
  </div>

</div>
