<div class="configure-page">

  <!-- ── Page header ──────────────────────────────────────────────────────── -->
  <div class="cfg-hdr">
    <button class="cfg-hdr__back" type="button" (click)="onCancel()" aria-label="Back">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div class="cfg-hdr__icon">
      <mat-icon>dashboard_customize</mat-icon>
    </div>
    <div class="cfg-hdr__text">
      <h2 class="cfg-hdr__title">Customize Dashboard</h2>
      <p class="cfg-hdr__sub">
        Drag to reorder · click <strong>+</strong> to add · <strong>×</strong> to remove
      </p>
    </div>
  </div>

  <!-- ── Loading ──────────────────────────────────────────────────────────── -->
  @if (loading()) {
    <div class="cfg-loading">
      <mat-spinner diameter="32" />
      <span>Loading your layout…</span>
    </div>
  } @else {
    <app-widget-picker
      [initialWidgets]="initialWidgets"
      [saving]="saving()"
      [showReset]="true"
      (saved)="onSave($event)"
      (reset)="onReset()"
      (cancelled)="onCancel()" />
  }

</div>
