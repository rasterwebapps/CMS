<div class="widget-shell">
  <div class="widget-header">
    <div class="widget-icon"><mat-icon>filter_alt</mat-icon></div>
    <span class="widget-title">Admission Funnel</span>
    @if (!loading() && !error() && data()) {
      <span class="overall-conv">
        <mat-icon>trending_up</mat-icon>{{ data()!.overallConversionPct }}% overall
      </span>
    }
  </div>

  <div class="widget-body">
    @if (loading()) {
      <div class="widget-loading">
        @for (n of [1,2,3,4,5]; track n) {
          <div style="margin-bottom: 10px;">
            <div class="sk-line sk-line--55" style="margin-bottom: 5px;"></div>
            <div class="sk-block" [style.width.%]="100 - n*12" style="height: 20px; border-radius: 5px;"></div>
          </div>
        }
      </div>
    } @else if (error() || !data() || data()!.stages.length === 0) {
      <div class="widget-error"><mat-icon>filter_alt_off</mat-icon><span>No funnel data</span></div>
    } @else {
      <div class="apex-wrap">
        <apx-chart
          [series]="chartSeries()"
          [chart]="apexChart"
          [xaxis]="apexXAxis"
          [yaxis]="apexYAxis"
          [plotOptions]="apexPlotOptions"
          [dataLabels]="apexDataLabels"
          [fill]="apexFill"
          [grid]="apexGrid"
          [tooltip]="apexTooltip"
          [colors]="['var(--cms-primary)']"
        ></apx-chart>
      </div>
    }
  </div>
</div>
