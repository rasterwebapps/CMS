<div class="mlp-page">

  <!-- ── Page Header ─────────────────────────────────────────── -->
  <div class="mlp-hdr anim-rise">
    <div class="mlp-hdr-left">
      <div class="page-title-row">
        <h1 class="tr-pg-title">Tax <em>Rules</em></h1>
      </div>
      <p class="tr-pg-sub">Named tax rates a Purchase Order line item can apply — kept minimal and deliberately not a full pluggable tax engine yet.</p>
    </div>
    <div class="mlp-hdr-actions">
      <button class="btn-primary" (click)="goToNew()" aria-label="Add new tax rule">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Tax Rule
      </button>
    </div>
  </div>

  <!-- ── Toolbar ───────────────────────────────────────────────── -->
  <div class="mlp-toolbar anim-rise anim-rise--d1">
    <div class="search-bar" role="search">
      <svg class="search-bar__icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input
        class="search-bar__input"
        [value]="searchValue()"
        (input)="applyFilter($event)"
        placeholder="Search by name…"
        type="text"
        aria-label="Search tax rules"
      />
      @if (searchValue()) {
        <button class="search-bar__clear" (click)="clearFilter()" aria-label="Clear search">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      }
    </div>
  </div>

  <div class="content-card mlp-table-card">
    <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" class="tr-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>
      <ng-container matColumnDef="ratePercent">
        <th mat-header-cell *matHeaderCellDef class="cell-align-right">Rate</th>
        <td mat-cell *matCellDef="let row" class="cell-align-right">{{ row.ratePercent }}%</td>
      </ng-container>
      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef class="cell-align-center">Status</th>
        <td mat-cell *matCellDef="let row" class="cell-align-center">
          <cms-status-badge [status]="row.isActive ? 'ACTIVE' : 'INACTIVE'" />
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"></th>
        <td mat-cell *matCellDef="let row">
          <div class="row-actions">
            <cms-row-action-btn variant="warning" [iconOnly]="true" (clicked)="toggleStatus(row)"
                    [tooltip]="row.isActive ? 'Deactivate' : 'Activate'" ariaLabel="Toggle tax rule status">
              <cms-icon-toggle-status [active]="row.isActive" [size]="14" />
            </cms-row-action-btn>
            <cms-row-action-btn variant="success" [iconOnly]="true" tooltip="Edit" ariaLabel="Edit" (clicked)="editTaxRule(row)">
              <cms-icon-edit [size]="14" />
            </cms-row-action-btn>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="padding:0; border:none;">
          <cms-empty-state
            icon="percent"
            [title]="searchValue() ? 'No tax rules found' : 'No tax rules yet'"
            [subtitle]="searchValue() ? 'No tax rules match your search.' : 'Add your first tax rate to get started.'"
            [actionLabel]="searchValue() ? 'Clear Search' : 'Add Tax Rule'"
            (actionClick)="handleEmptyAction()"
          ></cms-empty-state>
        </td>
      </tr>
    </table>
    </div>
    <mat-paginator [length]="totalElements" [pageSizeOptions]="[10, 25, 50]" [pageSize]="25" showFirstLastButtons></mat-paginator>
  </div>

</div>
