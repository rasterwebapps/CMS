<div class="mlp-page">

  <!-- ── Page Header ─────────────────────────────────────────── -->
  <div class="mlp-hdr anim-rise">
    <div class="mlp-hdr-left">
      <div class="page-title-row">
        <h1 class="sr-pg-title">Supplier <em>Returns</em></h1>
      </div>
      <p class="sr-pg-sub">Return previously-received stock to the supplier it came from.</p>
    </div>
    <div class="mlp-hdr-actions">
      <button class="btn-primary" (click)="goToNew()" aria-label="Start a new supplier return">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Return
      </button>
    </div>
  </div>

  <!-- ── Toolbar ───────────────────────────────────────────────── -->
  <div class="mlp-toolbar anim-rise anim-rise--d1">
    <select class="field-select sr-filter" [(ngModel)]="statusFilter" (ngModelChange)="onFilterChange()" aria-label="Filter by status">
      <option [ngValue]="null">All Statuses</option>
      <option value="DRAFT">Draft</option>
      <option value="COMPLETED">Completed</option>
      <option value="CANCELLED">Cancelled</option>
    </select>
  </div>

  <div class="content-card mlp-table-card">
    <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" class="sr-table">
      <ng-container matColumnDef="returnDate">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let row">{{ row.returnDate | date: 'mediumDate' }}</td>
      </ng-container>
      <ng-container matColumnDef="goodsReceiptId">
        <th mat-header-cell *matHeaderCellDef>Receipt</th>
        <td mat-cell *matCellDef="let row">#{{ row.goodsReceiptId }}</td>
      </ng-container>
      <ng-container matColumnDef="supplierName">
        <th mat-header-cell *matHeaderCellDef>Supplier</th>
        <td mat-cell *matCellDef="let row">{{ row.supplierName }}</td>
      </ng-container>
      <ng-container matColumnDef="locationVirtualName">
        <th mat-header-cell *matHeaderCellDef>Location</th>
        <td mat-cell *matCellDef="let row">{{ row.locationVirtualName }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef class="cell-align-center">Status</th>
        <td mat-cell *matCellDef="let row" class="cell-align-center">
          <cms-status-badge [status]="row.status" />
        </td>
      </ng-container>
      <ng-container matColumnDef="lineCount">
        <th mat-header-cell *matHeaderCellDef class="cell-align-right">Lines</th>
        <td mat-cell *matCellDef="let row" class="cell-align-right">{{ row.lineCount }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"></th>
        <td mat-cell *matCellDef="let row">
          <div class="row-actions">
            <cms-row-action-btn variant="success" [iconOnly]="true" tooltip="Open" ariaLabel="Open supplier return" (clicked)="openReturn(row)">
              <cms-icon-view [size]="14" />
            </cms-row-action-btn>
          </div>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="openReturn(row)" class="sr-row"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length" style="padding:0; border:none;">
          <cms-empty-state
            icon="keyboard_return"
            title="No supplier returns yet"
            subtitle="Return previously-received stock against a confirmed goods receipt to see it here."
            actionLabel="New Return"
            (actionClick)="goToNew()"
          ></cms-empty-state>
        </td>
      </tr>
    </table>
    </div>
    <mat-paginator [length]="totalElements" [pageSizeOptions]="[10, 25, 50]" [pageSize]="25" showFirstLastButtons></mat-paginator>
  </div>

</div>
