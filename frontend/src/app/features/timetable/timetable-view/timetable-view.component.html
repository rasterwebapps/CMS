<div class="mlp-page">

  <div class="mlp-hdr anim-rise">
    <div class="mlp-hdr-left">
      <h1 class="page-title">Timetable</h1>
      <p class="page-subtitle">Browse the published theory and lab timetable for a term</p>
    </div>
  </div>

  <div class="mlp-toolbar anim-rise anim-rise--d1">
    <select class="mlp-filter-select" [(ngModel)]="selectedAcademicYearId" (ngModelChange)="onAcademicYearChange()" aria-label="Academic year">
      @for (ay of academicYears(); track ay.id) {
        <option [ngValue]="ay.id">{{ ay.name }}</option>
      }
    </select>
    <select class="mlp-filter-select" [(ngModel)]="selectedTermInstanceId" (ngModelChange)="onTermChange()"
      [disabled]="termsLoading() || termInstances().length === 0" aria-label="Term">
      @if (termInstances().length === 0) {
        <option [ngValue]="null">No terms yet</option>
      }
      @for (term of termInstances(); track term.id) {
        <option [ngValue]="term.id">{{ term.termType }} · {{ term.status }}</option>
      }
    </select>

    <div class="view-mode-toggle">
      <button type="button" class="view-mode-toggle__btn" [class.view-mode-toggle__btn--active]="viewMode() === 'week'" (click)="setViewMode('week')">Week</button>
      <button type="button" class="view-mode-toggle__btn" [class.view-mode-toggle__btn--active]="viewMode() === 'month'" (click)="setViewMode('month')">Month</button>
      <button type="button" class="view-mode-toggle__btn" [class.view-mode-toggle__btn--active]="viewMode() === 'day'" (click)="setViewMode('day')">Day</button>
    </div>

    @if (viewMode() === 'day') {
      <label class="day-picker">
        <span class="day-picker__label">Date</span>
        <input type="date" class="field-input" [ngModel]="dayDate()" (ngModelChange)="onDayDateChange($event)"
          [min]="dayMin" [max]="dayMax" aria-label="Day date" />
      </label>
    }

    <select class="mlp-filter-select" [ngModel]="selectedFaculty()" (ngModelChange)="selectedFaculty.set($event)" aria-label="Faculty">
      <option [ngValue]="null">All Faculty</option>
      @for (name of facultyOptions(); track name) {
        <option [ngValue]="name">{{ name }}</option>
      }
    </select>

    <select class="mlp-filter-select" [ngModel]="selectedRoom()" (ngModelChange)="selectedRoom.set($event)" aria-label="Room">
      <option [ngValue]="null">All Rooms</option>
      @for (name of roomOptions(); track name) {
        <option [ngValue]="name">{{ name }}</option>
      }
    </select>

    <select class="mlp-filter-select" [ngModel]="selectedBatch()" (ngModelChange)="selectedBatch.set($event)" aria-label="Batch">
      <option [ngValue]="null">All Batches</option>
      @for (name of batchOptions(); track name) {
        <option [ngValue]="name">{{ name }}</option>
      }
    </select>
  </div>

  <div class="content-card">
    @if (viewMode() === 'week') {
      @if (loading()) {
        <div class="loading-container">
          <mat-spinner diameter="36" aria-label="Loading timetable"></mat-spinner>
        </div>
      } @else {
        <cms-week-grid mode="browse" [sessions]="filteredSessions()" />
      }
    } @else if (viewMode() === 'month') {
      @if (occurrencesLoading()) {
        <div class="loading-container">
          <mat-spinner diameter="36" aria-label="Loading month view"></mat-spinner>
        </div>
      } @else {
        <cms-month-grid [year]="monthYear()" [month]="monthMonth()" [occurrences]="filteredOccurrences()"
          (monthChange)="onMonthChange($event)" (dayClick)="onMonthDayClick($event)" />
      }
    } @else {
      @if (occurrencesLoading()) {
        <div class="loading-container">
          <mat-spinner diameter="36" aria-label="Loading day view"></mat-spinner>
        </div>
      } @else {
        <cms-day-agenda [date]="dayDate()" [occurrences]="filteredOccurrences()" />
      }
    }
  </div>

</div>
