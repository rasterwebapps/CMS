<div class="widget-shell">
  <div class="widget-header">
    <div class="widget-icon"><mat-icon>trending_up</mat-icon></div>
    <span class="widget-title">Admission Trend</span>
    <a routerLink="/reports" class="widget-action">View all →</a>
  </div>

  <div class="widget-body">
    @if (loading()) {
      <div class="chart-area chart-area--loading">
        @for (n of [1,2,3,4,5,6]; track n) {
          <div class="sk-bar" [style.height.%]="30 + n * 10"></div>
        }
      </div>
    } @else if (error() || points().length === 0) {
      <div class="widget-error">
        <mat-icon>bar_chart</mat-icon>
        <span>No trend data available</span>
      </div>
    } @else {
      <div class="apex-wrap">
        <apx-chart
          [series]="chartSeries()"
          [chart]="apexChart"
          [xaxis]="apexXAxis"
          [yaxis]="apexYAxis"
          [stroke]="apexStroke"
          [fill]="apexFill"
          [grid]="apexGrid"
          [dataLabels]="apexDataLabels"
          [markers]="apexMarkers"
          [tooltip]="apexTooltip"
          [colors]="['var(--cms-primary)']"
        ></apx-chart>
      </div>
    }
  </div>
</div>
