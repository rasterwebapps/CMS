# ── Rate limiting ─────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

# ── Dynamic port extraction from Host header ──────────────────────────────────
# Handles both cms.nursing.sksh.ac.in and IP:port transparently.
map $http_host $forwarded_port {
    ~:(\d+)$  $1;
    default   443;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_tokens off;
    client_max_body_size 10m;
    autoindex off;

    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/self.crt;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                              always;
    add_header X-Frame-Options           "SAMEORIGIN"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # ── Block Keycloak Admin Console from public access ───────────────────────
    # Keycloak admin (/admin/) must only be accessed via SSH tunnel on port 8180.
    # This block provides defence-in-depth in case a proxy rule is ever added.
    location /admin/ {
        return 403;
    }

    # ── Keycloak proxy ────────────────────────────────────────────────────────
    # X-Forwarded-Host is ALWAYS canonical so JWTs always carry the same issuer
    # the Spring Boot backend trusts.
    #
    # sub_filter rewrites absolute Keycloak URLs in HTML responses so that form
    # actions and redirects point back to the origin the browser actually used.
    location /realms/ {
        limit_req zone=auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host              cms.nursing.sksh.ac.in;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  cms.nursing.sksh.ac.in;
        proxy_set_header X-Forwarded-Port  443;
        # Disable upstream compression so sub_filter can read the body
        proxy_set_header Accept-Encoding   "";
        # Rewrite canonical URLs back to the browser's actual origin
        sub_filter      'https://cms.nursing.sksh.ac.in' 'https://$http_host';
        sub_filter_once off;
        sub_filter_types text/html application/json;
        proxy_buffer_size  128k;
        proxy_buffers      4 256k;
    }

    location /resources/ {
        limit_req zone=auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host              cms.nursing.sksh.ac.in;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;
        proxy_set_header Accept-Encoding   "";
        sub_filter      'https://cms.nursing.sksh.ac.in' 'https://$http_host';
        sub_filter_once off;
        sub_filter_types text/html application/json;
    }

    # ── Spring Boot API proxy ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── env.js — never cache (content changes per deployment/server) ──────────
    location = /assets/env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        expires 0;
    }

    # ── Angular SPA ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none';" always;
    }
}
