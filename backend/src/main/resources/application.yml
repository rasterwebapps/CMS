spring:
  profiles:
    default: local

  application:
    name: cms-backend

  cache:
    type: none

  threads:
    virtual:
      enabled: true

  # Serialize Instant/Date as ISO-8601 UTC strings (e.g. "2026-04-28T08:30:00Z")
  # so the frontend receives UTC timestamps and converts them to local time.
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  # Force Hibernate/JDBC to store and read all timestamp columns in UTC.
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Allow uploading reasonably-large PDF/image documents (e.g. faculty photos,
  # signed appointment letters). The faculty UI advertises 10 MB per file —
  # both the per-file and per-request limits must accommodate that.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  servlet:
    context-path: /api/v1

# CORS allowed origins — override per profile or environment variable
cors:
  allowed-origins: http://localhost:4200,http://localhost:4300

# Seed data is opt-in only. The default local profile must use the actual
# PostgreSQL data that is already present in the configured database.
cms:
  seed:
    enabled: false

