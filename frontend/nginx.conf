# ── Rate limiting zones ───────────────────────────────────────────────────────
# Auth endpoints (Keycloak): 5 req/s per IP, burst of 10
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
# API endpoints: 30 req/s per IP, burst of 60
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# TEMPORARY: HTTP-only until SSL certificate is provisioned.
# When a cert is available, restore the 80→443 redirect and the ssl server block.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ─────────────────────────────────────────────────────
    # Note: Strict-Transport-Security (HSTS) is omitted — only valid over HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # ── Proxy Keycloak ───────────────────────────────────────────────────────
    location /realms/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://keycloak:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  80;
        proxy_buffer_size         128k;
        proxy_buffers             4 256k;
    }

    location /resources/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://keycloak:8080;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Port  80;
    }

    # ── Proxy Spring Boot API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
    }

    # ── Angular SPA ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
