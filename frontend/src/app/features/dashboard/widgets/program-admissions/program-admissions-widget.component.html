<div class="widget-shell">
  <div class="widget-header">
    <div class="widget-icon"><mat-icon>school</mat-icon></div>
    <span class="widget-title">Admissions by Program</span>
    @if (!loading() && !error() && total() > 0) {
      <span class="total-pill">{{ total() }} students</span>
    }
  </div>

  <div class="widget-body">
    @if (loading()) {
      <div class="widget-loading">
        @for (n of [1,2,3,4,5]; track n) {
          <div style="margin-bottom: 10px;">
            <div class="sk-line" [style.width.%]="40 + n*8" style="margin-bottom: 5px;"></div>
            <div class="sk-block" style="height: 18px; border-radius: 4px;"></div>
          </div>
        }
      </div>
    } @else if (error() || rows().length === 0) {
      <div class="widget-error"><mat-icon>school</mat-icon><span>No program data</span></div>
    } @else {
      <div class="apex-wrap">
        <apx-chart
          [series]="chartSeries()"
          [chart]="apexChart"
          [xaxis]="apexXAxis"
          [yaxis]="apexYAxis"
          [plotOptions]="apexPlotOptions"
          [dataLabels]="apexDataLabels"
          [fill]="apexFill"
          [grid]="apexGrid"
          [tooltip]="apexTooltip"
          [colors]="['var(--cms-primary)']"
        ></apx-chart>
      </div>
    }
  </div>
</div>
