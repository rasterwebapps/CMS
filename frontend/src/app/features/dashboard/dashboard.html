<div class="dashboard-shell">
  @if (activeDashboard() === 'admin') {
    <app-admin-dashboard />
  } @else if (activeDashboard() === 'front-office') {
    <app-front-office-dashboard />
  } @else if (activeDashboard() === 'cashier') {
    <app-cashier-dashboard />
  } @else if (activeDashboard() === 'faculty') {
    <app-faculty-dashboard />
  }
</div>
