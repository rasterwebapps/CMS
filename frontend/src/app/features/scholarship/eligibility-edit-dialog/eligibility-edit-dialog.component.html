<div mat-dialog-title class="eed-dialog-title-bar">
  <div class="eed-dialog-title-bar__icon-wrap">
    <mat-icon>verified_user</mat-icon>
  </div>
  <div>
    <h2 class="eed-dialog-title-bar__heading">Update Eligibility Profile</h2>
    <p class="eed-dialog-title-bar__sub">{{ data.studentName }}</p>
  </div>
</div>

<mat-dialog-content>
  <form [formGroup]="form" class="eed-form">

    <!-- ── Eligibility Flags ── -->
    <p class="eed-section-title">Eligibility Flags</p>
    <div class="eed-flags-grid">

      <label class="eed-flag-card" [class.eed-flag-card--on]="form.get('isFirstGraduate')?.value">
        <input type="checkbox" class="eed-sr-only" formControlName="isFirstGraduate" />
        <mat-icon class="eed-flag-card__icon">school</mat-icon>
        <div class="eed-flag-card__body">
          <span class="eed-flag-card__name">First Graduate</span>
        </div>
        <span class="eed-flag-card__badge">{{ form.get('isFirstGraduate')?.value ? 'Yes' : 'No' }}</span>
      </label>

      <label class="eed-flag-card" [class.eed-flag-card--on]="form.get('isMeritBased')?.value">
        <input type="checkbox" class="eed-sr-only" formControlName="isMeritBased" />
        <mat-icon class="eed-flag-card__icon">emoji_events</mat-icon>
        <div class="eed-flag-card__body">
          <span class="eed-flag-card__name">Merit Based</span>
        </div>
        <span class="eed-flag-card__badge">{{ form.get('isMeritBased')?.value ? 'Yes' : 'No' }}</span>
      </label>

      <label class="eed-flag-card" [class.eed-flag-card--on]="form.get('isSportsQuota')?.value">
        <input type="checkbox" class="eed-sr-only" formControlName="isSportsQuota" />
        <mat-icon class="eed-flag-card__icon">sports</mat-icon>
        <div class="eed-flag-card__body">
          <span class="eed-flag-card__name">Sports Quota</span>
        </div>
        <span class="eed-flag-card__badge">{{ form.get('isSportsQuota')?.value ? 'Yes' : 'No' }}</span>
      </label>

      <label class="eed-flag-card" [class.eed-flag-card--on]="form.get('isEconomicallyWeaker')?.value">
        <input type="checkbox" class="eed-sr-only" formControlName="isEconomicallyWeaker" />
        <mat-icon class="eed-flag-card__icon">account_balance</mat-icon>
        <div class="eed-flag-card__body">
          <span class="eed-flag-card__name">EWS</span>
        </div>
        <span class="eed-flag-card__badge">{{ form.get('isEconomicallyWeaker')?.value ? 'Yes' : 'No' }}</span>
      </label>

    </div>

    <!-- Annual Family Income -->
    <div class="field-group">
      <label for="eed-income" class="field-label">Annual Family Income (₹)</label>
      <input
        id="eed-income"
        class="field-input"
        type="number"
        formControlName="annualFamilyIncome"
        min="0"
        placeholder="e.g. 2,50,000"
      />
      @if (ewsAutoHint()) {
        <p class="field-hint eed-hint--ews">
          <mat-icon>info</mat-icon>
          Income below ₹3,00,000 qualifies for EWS automatically.
        </p>
      }
    </div>

    <!-- ── Community Certificate ── -->
    <p class="eed-section-title">Community Certificate</p>
    <div class="eed-cert-section">
      <div class="eed-cert-grid">
        <div class="field-group">
          <label for="eed-comm-no" class="field-label">Certificate No.</label>
          <input id="eed-comm-no" class="field-input" formControlName="communityCertificateNumber" placeholder="TN/2025/CC/001" />
        </div>
        <div class="field-group">
          <label for="eed-comm-auth" class="field-label">Issuing Authority</label>
          <input id="eed-comm-auth" class="field-input" formControlName="commCertIssuingAuthority" placeholder="Tahsildar, Coimbatore" />
        </div>
        <div class="field-group">
          <label for="eed-comm-date" class="field-label">Issue Date</label>
          <input id="eed-comm-date" class="field-input" type="date" formControlName="commCertIssueDate" />
        </div>
      </div>
    </div>

    <!-- ── Income Certificate ── -->
    <p class="eed-section-title">Income Certificate</p>
    <div class="eed-cert-section">
      <div class="eed-cert-grid">
        <div class="field-group">
          <label for="eed-inc-no" class="field-label">Certificate No.</label>
          <input id="eed-inc-no" class="field-input" formControlName="incomeCertificateNumber" placeholder="TN/2025/IC/001" />
        </div>
        <div class="field-group">
          <label for="eed-inc-auth" class="field-label">Issuing Authority</label>
          <input id="eed-inc-auth" class="field-input" formControlName="incomeCertIssuingAuthority" placeholder="Tahsildar, Salem" />
        </div>
        <div class="field-group">
          <label for="eed-inc-date" class="field-label">Issue Date</label>
          <input id="eed-inc-date" class="field-input" type="date" formControlName="incomeCertIssueDate" />
        </div>
      </div>
    </div>

    <!-- ── First Graduate Certificate (conditional) ── -->
    @if (isFirstGraduate()) {
      <p class="eed-section-title">First Graduate Certificate &amp; Parents' Education</p>
      <div class="eed-cert-section">
        <div class="eed-cert-grid">
          <div class="field-group">
            <label for="eed-fg-no" class="field-label">Certificate No.</label>
            <input id="eed-fg-no" class="field-input" formControlName="firstGraduateCertificateNumber" placeholder="TN/2025/FG/001" />
          </div>
          <div class="field-group">
            <label for="eed-fg-auth" class="field-label">Issuing Authority</label>
            <input id="eed-fg-auth" class="field-input" formControlName="firstGradCertIssuingAuthority" placeholder="Village Administrative Officer" />
          </div>
          <div class="field-group">
            <label for="eed-fg-date" class="field-label">Issue Date</label>
            <input id="eed-fg-date" class="field-input" type="date" formControlName="firstGradCertIssueDate" />
          </div>
        </div>
        <div class="eed-parents-grid">
          <div class="field-group">
            <label for="eed-father-edu" class="field-label">Father's Highest Education</label>
            <input id="eed-father-edu" class="field-input" formControlName="fatherEducation" placeholder="e.g. Class 10, Diploma" />
          </div>
          <div class="field-group">
            <label for="eed-mother-edu" class="field-label">Mother's Highest Education</label>
            <input id="eed-mother-edu" class="field-input" formControlName="motherEducation" placeholder="e.g. Class 8, Illiterate" />
          </div>
        </div>
      </div>
    }

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button class="btn-secondary" type="button" (click)="onCancel()" [disabled]="saving()">
    Cancel
  </button>
  <button class="btn-primary" type="button" (click)="onSubmit()" [disabled]="saving()">
    @if (saving()) {
      <mat-spinner diameter="18" class="btn-spinner"></mat-spinner>
    } @else {
      <mat-icon>save</mat-icon>
    }
    Save Eligibility
  </button>
</mat-dialog-actions>
