# Production docker-compose — deployment server: 172.16.7.209
# Run from /docker_data on the server:
#   docker compose -f docker-compose.prod.yml -f docker-compose.local.yml --env-file .env up -d
#
# Required variables in /docker_data/.env (chmod 600):
#   DB_USERNAME            → PostgreSQL username  (e.g. cms_user)
#   DB_PASSWORD            → PostgreSQL password  (strong, unique)
#   KEYCLOAK_ADMIN_PASSWORD→ Keycloak admin password (must differ from DB_PASSWORD)
#   DEPLOY_HOST            → 172.16.7.209
#
# NOTE: Using host networking (network_mode: host) — required for Proxmox LXC containers
# where Docker bridge networking is blocked at the sysctl level.
# All services share the host network namespace and communicate via localhost.
# Port layout:
#   5433 — PostgreSQL (avoids conflict with host's PostgreSQL 12 on 5432)
#   8080 — Spring Boot backend
#   8180 — Keycloak
#   80   — Nginx (public entry point)
#
# NOTE: HTTP-only until SSL certificate is provisioned.
# When cert is ready: restore 443 in nginx.conf and update this file accordingly.

version: '3.9'

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  # Runs on port 5433 (host's PostgreSQL 12 already occupies 5432).
  # Data persisted in Docker root (/docker_root/volumes/).
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB:       cms
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT:            "5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d cms -p 5433"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak ───────────────────────────────────────────────────────────────
  # Runs on port 8180. Exposed externally via Nginx /realms/ proxy only.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    network_mode: host
    command: start --import-realm
    environment:
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://localhost:5433/cms
      KC_DB_USERNAME:          ${DB_USERNAME}
      KC_DB_PASSWORD:          ${DB_PASSWORD}
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_URL:         http://${DEPLOY_HOST}
      KC_HTTP_ENABLED:         "true"
      KC_HTTP_PORT:            "8180"
      KC_HOSTNAME_STRICT:      "false"
      KC_PROXY_HEADERS:        xforwarded
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  # ── Backend (Spring Boot) ──────────────────────────────────────────────────
  # Runs on port 8080. Exposed externally via Nginx /api/ proxy only.
  backend:
    image: cms-backend:latest
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL:                 jdbc:postgresql://localhost:5433/cms
      DB_USERNAME:            ${DB_USERNAME}
      DB_PASSWORD:            ${DB_PASSWORD}
      # External URL — matches the 'iss' claim Keycloak puts in JWTs
      KEYCLOAK_ISSUER_URI:    http://${DEPLOY_HOST}/realms/cms
      # Internal localhost URL — backend fetches public keys directly from Keycloak
      KEYCLOAK_JWK_SET_URI:   http://localhost:8180/realms/cms/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS:   http://${DEPLOY_HOST}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Nginx) ───────────────────────────────────────────────────────
  # Runs on port 80. nginx.conf proxies /api/ → :8080, /realms/ → :8180.
  frontend:
    image: cms-frontend:latest
    restart: unless-stopped
    network_mode: host
    environment:
      KEYCLOAK_URL:      http://${DEPLOY_HOST}
      KEYCLOAK_UPSTREAM: 127.0.0.1:8180
      BACKEND_UPSTREAM:  127.0.0.1:8080
    depends_on:
      - backend

volumes:
  postgres_data:
