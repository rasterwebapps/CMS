spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5435/cmsdb_test}
    driver-class-name: org.postgresql.Driver
    username: ${TEST_DB_USERNAME:${DB_USERNAME:cms}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:cms}}

  test:
    database:
      replace: none

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8280/realms/cms
