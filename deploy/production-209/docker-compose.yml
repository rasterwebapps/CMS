# Production docker-compose — dedicated deployment server: 172.16.7.209
#
# Run only on 172.16.7.209 from /docker_data/skscms209:
#   docker compose -p skscms209 -f docker-compose.yml --env-file .env up -d
#
# Required variables in /docker_data/skscms209/.env (chmod 600):
#   DB_USERNAME
#   DB_PASSWORD
#   KEYCLOAK_ADMIN_PASSWORD
#   DEPLOY_HOST=172.16.7.209
#
# This file is intentionally separate from legacy 243 deployment files.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGPORT: '5433'
    volumes:
      - postgres_data_209:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d cms -p 5433']
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    network_mode: host
    command: start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5433/cms
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_URL: https://${DEPLOY_HOST}
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_PORT: '8180'
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: cms-backend:latest
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: 209
      DB_URL: jdbc:postgresql://localhost:5433/cms
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: https://${DEPLOY_HOST}/realms/cms
      KEYCLOAK_JWK_SET_URI: http://localhost:8180/realms/cms/protocol/openid-connect/certs
      CORS_ALLOWED_ORIGINS: https://${DEPLOY_HOST}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:8080/api/v1/health >/dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: cms-frontend:latest
    restart: unless-stopped
    network_mode: host
    environment:
      KEYCLOAK_URL: https://${DEPLOY_HOST}
      KEYCLOAK_REALM: cms
      KEYCLOAK_CLIENT_ID: cms-frontend
      KEYCLOAK_UPSTREAM: 127.0.0.1:8180
      BACKEND_UPSTREAM: 127.0.0.1:8080
      EXTERNAL_HTTPS_PORT: '443'
    depends_on:
      - backend

volumes:
  postgres_data_209:

