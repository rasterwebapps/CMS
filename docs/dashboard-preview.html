/* ── Tooltip ──────────────────────────────────────────────────────────────── */
function Tooltip({ children, label, side = 'right', disabled = false }) {
  const [show, setShow] = useState(false);
  if (disabled || !label) return children;
  return (
    <div
      className="relative"
      onMouseEnter={() => setShow(true)}
      onMouseLeave={() => setShow(false)}
    >
      {children}
      {show && (
        <div
          role="tooltip"
          className={[
            'absolute z-[100] px-2.5 py-1.5 text-xs font-medium text-white',
            'bg-slate-800 rounded-lg shadow-xl whitespace-nowrap pointer-events-none',
            'animate-[fadeIn_80ms_ease]',
            side === 'right'  ? 'left-full ml-3 top-1/2 -translate-y-1/2' : '',
            side === 'bottom' ? 'top-full mt-2 left-1/2 -translate-x-1/2' : '',
          ].join(' ')}
        >
          {label}
          {side === 'right' && (
            <span className="absolute right-full top-1/2 -translate-y-1/2 border-[5px] border-transparent border-r-slate-800" />
          )}
        </div>
      )}
    </div>
  );
}

/* ── Rail button (Pane 1) ─────────────────────────────────────────────────── */
function RailButton({ group, isActive, onClick, dark }) {
  return (
    <Tooltip label={group.label} side="right">
      <button
        onClick={onClick}
        aria-label={group.label}
        aria-pressed={isActive}
        className={[
          'relative flex items-center justify-center w-10 h-10 rounded-xl',
          'transition-all duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400',
          isActive
            ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/40'
            : dark
              ? 'text-slate-400 hover:bg-slate-700/70 hover:text-slate-200'
              : 'text-slate-400 hover:bg-slate-700/70 hover:text-slate-200',
        ].join(' ')}
      >
        <group.Icon size={18} strokeWidth={isActive ? 2.2 : 1.8} />
        {isActive && (
          <span className="absolute -right-0.5 top-1/2 -translate-y-1/2 w-0.5 h-5 bg-indigo-300 rounded-full" />
        )}
      </button>
    </Tooltip>
  );
}

/* ── Sidebar nav item (Pane 2) ───────────────────────────────────────────── */

      <button
        onClick={onClick}
        aria-current={isActive ? 'page' : undefined}

              : 'max-width 280ms ease-in-out, opacity 80ms ease-in-out',

              dark ? 'bg-indigo-400' : 'bg-indigo-600',

              opacity: expanded ? 1 : 0,

                   ?? activeGroup.items[0];

    const group = NAV_GROUPS.find(g => g.id === groupId);

          >
            <button
              onClick={() => setSidebarExpanded(v => !v)}
              aria-label={sidebarExpanded ? 'Collapse sidebar' : 'Expand sidebar'}
              className={[
                'flex-shrink-0 flex items-center justify-center w-8 h-8 rounded-lg transition-all duration-150',
                d
                  ? 'text-slate-500 hover:bg-slate-800 hover:text-slate-300'
                  : 'text-slate-400 hover:bg-slate-200 hover:text-slate-600',
              ].join(' ')}
              style={{ transform: sidebarExpanded ? 'none' : 'scaleX(-1)' }}
            >
              <PanelLeft size={16} strokeWidth={1.8} />
            </button>
          </Tooltip>
        </div>

        {/* Nav items */}
        <div className="flex-1 overflow-y-auto overflow-x-hidden py-2 px-1.5">
          {activeGroup.items.map(item => (
            <SidebarItem
              key={item.id}
              item={item}
              isActive={item.id === activeItemId}
              expanded={sidebarExpanded}
              onClick={() => selectItem(item.id)}
              dark={d}
            />
          ))}
        </div>

        {/* Sidebar footer */}
        <div
          className={`border-t flex-shrink-0 overflow-hidden ${d ? 'border-slate-800' : 'border-slate-200'}`}
          style={{
            maxHeight: sidebarExpanded ? '48px' : '0px',
            opacity: sidebarExpanded ? 1 : 0,
            transition: 'max-height 280ms ease-in-out, opacity 150ms ease-in-out',
          }}
        >
          <div className="px-4 py-3">
            <p className={`text-[11px] whitespace-nowrap ${d ? 'text-slate-600' : 'text-slate-400'}`}>
              <span className="font-semibold">OneCMS</span> · Raster Images Pvt. Ltd.
            </p>
          </div>
        </div>
      </aside>

      {/* ══ PANE 3 — Detail Canvas ══════════════════════════════════════════ */}
      <main
        className={`flex-1 flex flex-col overflow-hidden md:mt-0 mt-14 min-w-0 ${d ? 'bg-slate-950' : 'bg-white'}`}
      >
        {/* Canvas header / breadcrumb bar */}
        <header className={[
          'flex-shrink-0 flex items-center h-14 px-6 border-b gap-4',
          d ? 'bg-slate-950 border-slate-800' : 'bg-white border-slate-200',
        ].join(' ')}>
          {/* Breadcrumb */}
          <div className="flex items-center gap-1.5 min-w-0">
            <span className={`hidden sm:block text-xs ${d ? 'text-slate-500' : 'text-slate-400'} flex-shrink-0`}>
              {activeGroup.label}
            </span>
            <ChevronRight size={12} className={`hidden sm:block flex-shrink-0 ${d ? 'text-slate-700' : 'text-slate-300'}`} />
            <span className={`text-sm font-semibold truncate ${d ? 'text-slate-100' : 'text-slate-800'}`}>
              {activeItem.label}
            </span>
          </div>

          <div className="ml-auto flex items-center gap-2 flex-shrink-0">
            {/* Fake search pill */}
            <button className={[
              'hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-lg border text-xs transition-colors',
              d
                ? 'border-slate-800 text-slate-500 hover:bg-slate-900 hover:text-slate-300'
                : 'border-slate-200 text-slate-400 hover:bg-slate-50 hover:text-slate-600',
            ].join(' ')}>
              <Search size={13} strokeWidth={1.8} />
              <span>Search</span>
              <kbd className={`ml-1 px-1.5 py-0.5 text-[10px] rounded font-mono ${d ? 'bg-slate-800 text-slate-600' : 'bg-slate-100 text-slate-400'}`}>/</kbd>
            </button>
          </div>
        </header>

        {/* Canvas content */}
        <div className={`flex-1 overflow-auto ${d ? 'bg-slate-950' : 'bg-slate-50/60'}`}>
          <div className="flex flex-col items-center justify-center min-h-full p-8">
            <div className={[
              'rounded-2xl border shadow-sm p-10 text-center w-full max-w-sm',
              d ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200',
            ].join(' ')}>
              <div className={[
                'w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-5',
                d ? 'bg-indigo-500/15' : 'bg-indigo-50',
              ].join(' ')}>
                <activeItem.Icon
                  size={26}
                  strokeWidth={1.8}
                  className={d ? 'text-indigo-400' : 'text-indigo-600'}
                />
              </div>
              <h2 className={`text-base font-semibold mb-1 ${d ? 'text-slate-100' : 'text-slate-800'}`}>
                {activeItem.label}
              </h2>
              <p className={`text-sm mb-4 ${d ? 'text-slate-500' : 'text-slate-400'}`}>
                {activeGroup.label}
              </p>
              <code className={`text-xs px-3 py-1.5 rounded-lg font-mono ${d ? 'bg-slate-800 text-slate-400' : 'bg-slate-100 text-slate-500'}`}>
                {activeItem.route}
              </code>
              <p className={`mt-5 text-xs leading-relaxed ${d ? 'text-slate-600' : 'text-slate-400'}`}>
                The Angular router-outlet content for this module renders here in the live application.
              </p>
            </div>

            {/* Quick links to other items in the group */}
            {activeGroup.items.length > 1 && (
              <div className="mt-6 w-full max-w-sm">
                <p className={`text-[10px] font-semibold uppercase tracking-widest mb-2 text-center ${d ? 'text-slate-600' : 'text-slate-400'}`}>
                  Other items in {activeGroup.label}
                </p>
                <div className="flex flex-wrap justify-center gap-1.5">
                  {activeGroup.items
                    .filter(i => i.id !== activeItemId)
                    .map(item => (
                      <button
                        key={item.id}
                        onClick={() => selectItem(item.id)}
                        className={[
                          'flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-150',
                          d
                            ? 'bg-slate-900 border border-slate-800 text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                            : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 hover:text-slate-800',
                        ].join(' ')}
                      >
                        <item.Icon size={12} strokeWidth={1.8} />
                        {item.label}
                      </button>
                    ))}
                </div>
              </div>
            )}
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
